<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luscinia Magna</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #12100e;
    color: #f5f0e8;
    font-family: 'Raleway', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 1.2rem;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 400;
    letter-spacing: 0.1em;
    color: #c9a84c;
  }
  .sub {
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #8a8078;
  }
  .line {
    width: 60px;
    height: 1px;
    background: #c9a84c;
    opacity: 0.5;
    margin: 0.5rem auto;
  }
  .msg {
    font-size: 0.9rem;
    font-weight: 300;
    font-style: italic;
    color: #bdb5aa;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <h1>Luscinia Magna</h1>
  <div class="sub">Smíšený pěvecký sbor</div>
  <div class="line"></div>
  <div class="msg">Stránky jsou ve výstavbě, brzy se vrátíme.</div>
</body>
</html>
